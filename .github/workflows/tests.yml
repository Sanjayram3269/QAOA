name: tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Reproduce ML selector
        run: >-
          python scripts/finalize_ml_selector.py
          --output-dir /tmp/qaoa-final-selector
          --permutation-repetitions 2
          --bootstrap-repetitions 200
          --no-plots
