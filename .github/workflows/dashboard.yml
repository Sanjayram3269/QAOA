name: Dashboard CI

on:
  push:
    paths:
      - 'dashboard/**'
      - 'data/ml/paper_results/**'
      - 'data/graphs/**'
      - 'config/experiment.yaml'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'data/ml/paper_results/**'
      - 'data/graphs/**'
      - 'config/experiment.yaml'
      - '.github/workflows/dashboard.yml'

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate dashboard source and frozen data
        run: npm test
      - name: Build production dashboard
        run: npm run build
